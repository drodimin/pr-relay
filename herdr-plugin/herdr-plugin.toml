# herdr plugin manifest for pr-relay (fields per herdr 0.9.5 schema).
# Install: herdr plugin install drodimin/pr-relay/herdr-plugin
# The plugin ships no binary; pr-relay must be on PATH (see run.sh).
id = "pr-relay"
name = "pr-relay"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Push GitHub PR updates into agent panes; starts the pr-relay daemon"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "run.sh", "daemon", "--ensure"]

[[actions]]
id = "status"
title = "pr-relay: status"
contexts = ["global"]
command = ["sh", "run.sh", "--open", "status-view"]

[[actions]]
id = "list-all"
title = "pr-relay: list all subscriptions"
contexts = ["global"]
command = ["sh", "run.sh", "--open", "list-view"]

[[actions]]
id = "restart"
title = "pr-relay: restart daemon"
contexts = ["global"]
command = ["sh", "run.sh", "daemon", "restart"]

[[actions]]
id = "install-skill"
title = "pr-relay: install agent skill"
contexts = ["global"]
command = ["sh", "run.sh", "skill", "install"]

# herdr shows action stdout only in the plugin command log, so the status and
# list-all actions open these popup panes to show their output (05-07 spike).
[[panes]]
id = "status-view"
title = "pr-relay status"
placement = "popup"
command = ["sh", "run.sh", "--hold", "status"]

[[panes]]
id = "list-view"
title = "pr-relay subscriptions"
placement = "popup"
command = ["sh", "run.sh", "--hold", "ls", "--all"]
