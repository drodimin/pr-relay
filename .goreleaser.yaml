# GoReleaser v2 config. Release: push a v* tag (see .github/workflows/release.yml).
# Local check: go run github.com/goreleaser/goreleaser/v2@v2.20.0 check
version: 2
project_name: pr-relay

before:
  hooks:
    # Download only; never tidy here (it can dirty the tree mid-release). CI enforces tidiness.
    - go mod download

builds:
  - id: pr-relay
    main: ./cmd/pr-relay
    binary: pr-relay
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      # Leading v so brew, release-download and go install builds all print pr-relay v0.1.0.
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^chore"]
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

homebrew_casks:
  - name: pr-relay
    binaries: [pr-relay]
    homepage: https://github.com/drodimin/pr-relay
    description: Push GitHub PR updates into herdr agent panes without polling
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    repository:
      owner: drodimin
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        # Unsigned binary: Homebrew quarantines cask downloads, so strip it on macOS.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/pr-relay"]
          end
